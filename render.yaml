# Render Blueprint — free web service.
# ⚠ DATA PERSISTENCE: Render's free plan has an ephemeral filesystem and no persistent disks.
# data/db.json (users, credits, leaderboards, prizes) is wiped on every redeploy/restart, and free
# services spin down after ~15 min idle. For real use, upgrade to a paid plan and attach a disk
# (uncomment below, set DATA_FILE=/var/data/db.json), or move storage to a hosted DB.
services:
  - type: web
    name: trenchwars
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/leaderboard
    envVars:
      - key: ADMIN_PASSWORD
        sync: false   # set in the Render dashboard
      - key: NODE_VERSION
        value: "20"
      # - key: DATA_FILE
      #   value: /var/data/db.json
    # disk:            # paid plans only
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
